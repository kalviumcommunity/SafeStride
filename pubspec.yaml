name: safestride
description: Community-Verified Routes for Urban Runners & Cyclists

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # State management
  provider: ^6.1.2
  shared_preferences: ^2.2.2

  # 🗺 OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # 📍 Location
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
